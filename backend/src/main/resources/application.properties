spring.application.name=placement-management-system

spring.datasource.url=jdbc:postgresql://localhost:5432/placement_management
spring.datasource.username=meetbhoi
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=placement-management-system-secret-key-for-jwt-token-generation-2024-college-project
jwt.expiration=86400000

# Server
server.port=8080

# Seed reference data after Hibernate validates the existing schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
